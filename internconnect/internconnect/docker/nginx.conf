# Only Ubuntu host loopback exposes this listener; cloudflared runs on that host.
map $http_x_forwarded_proto $origin_scheme {
    default $scheme;
    https https;
    http http;
}
map $http_cf_connecting_ip $origin_client {
    default $http_cf_connecting_ip;
    "" $remote_addr;
}
server {
    listen 80;
    server_name _;
    server_tokens off;
    # Re-resolve Docker DNS after API recreation (including public URL changes).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $api_upstream api:3001;
    root /usr/share/nginx/html;
    index index.html;
    # Default backend 5 MiB plus multipart overhead. Adjust together with MAX_UPLOAD_BYTES.
    client_max_body_size 6m;
    client_body_timeout 60s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location ~ /\. { return 404; }
    location = /api { include /etc/nginx/proxy_params_internconnect; }
    location /api/ { include /etc/nginx/proxy_params_internconnect; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html { add_header Cache-Control "no-store" always; }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
